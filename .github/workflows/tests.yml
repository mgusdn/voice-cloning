name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Install audio CLI for integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q chatbot voice_clone training tools
      - run: bash -n training/00_setup.sh
      - run: python -m chatbot --help
      - run: python -m voice_clone.infer --help
